<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pick a Case</title>
<style>
:root{--bg:#fff6ea;--fg:#1a1a1a;--card:#fff;--line:#f3d9b8;--accent:#ff5a00;--accentfg:#1a1a1a;--case:#ff7a00;--casefg:#1a1a1a;--err:#c0392b;--btn:#1a1a1a;--btnfg:#ffb400;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:linear-gradient(135deg,#ffb400 0%,#ff7a00 50%,#ff5a00 100%);background-attachment:fixed;color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
.screen{display:none;min-height:100vh;padding:64px 18px 28px;max-width:900px;margin:0 auto}.screen.on{display:block}
.back{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:12px;width:44px;height:44px;border-radius:50%;border:0;background:#1a1a1a;color:#ffb400;font-size:1.4rem;cursor:pointer;display:none;z-index:5}
h1{text-align:center;margin:8px 0 4px}.sub{text-align:center;opacity:.85;margin:0 0 22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:680px;margin:0 auto;box-shadow:0 8px 24px rgba(120,40,0,.25)}
input,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:1rem;font-family:inherit}textarea{min-height:200px;resize:vertical}
button{font-family:inherit;touch-action:manipulation}button.main{background:var(--btn);color:var(--btnfg);border:0;border-radius:10px;padding:12px 22px;font-size:1rem;cursor:pointer;margin-top:14px;width:100%}
.err{color:var(--err);min-height:1.2em;margin:8px 0 0;font-size:.9rem;font-weight:600}.modes{display:grid;gap:14px;max-width:680px;margin:0 auto}
.mode{background:var(--card);border:2px solid transparent;border-radius:16px;padding:22px;text-align:left;color:var(--fg);cursor:pointer;font-size:1rem;box-shadow:0 8px 24px rgba(120,40,0,.25);transition:transform .15s}.mode b{display:block;font-size:1.2rem;margin-bottom:4px}.mode:hover{transform:translateY(-2px)}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.ghost{background:#1a1a1a;color:#ffb400;border:0;border-radius:8px;padding:9px 12px;cursor:pointer}.ghost:active{transform:scale(.97)}.ghost.danger{background:#9b2118;color:#fff}.countline{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0 0}.hint{font-size:.88rem;opacity:.8}.warning{color:#b3261e;font-weight:600;font-size:.9rem;margin:8px 0 0}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.bar small{font-weight:600;opacity:1}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px;margin:14px 0 22px;background:#1a1a1a;padding:16px;border-radius:18px}
.case{background:none;border:0;padding:0;cursor:pointer;transition:transform .15s,opacity .35s;filter:drop-shadow(0 3px 2px rgba(0,0,0,.3));min-width:0}.case svg{width:100%;display:block}.case:active{transform:scale(.94)}.case.gone{opacity:0;transform:scale(.4);pointer-events:none}.case.shaking{animation:shake .65s ease-in-out}.ph{aspect-ratio:100/96}
@keyframes shake{0%,100%{transform:translateX(0) rotate(0)}15%{transform:translateX(-5px) rotate(-4deg)}30%{transform:translateX(5px) rotate(4deg)}45%{transform:translateX(-4px) rotate(-3deg)}60%{transform:translateX(4px) rotate(3deg)}75%{transform:translateX(-2px) rotate(-1deg)}}
.side{background:var(--card);border-radius:14px;padding:14px;box-shadow:0 8px 24px rgba(120,40,0,.2)}ol{margin:8px 0 0;padding-left:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}li{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;gap:10px}li .n{font-weight:700;color:var(--accent);min-width:2ch}
#ov,#resetOv{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;z-index:9;padding:20px}#ov.on,#resetOv.on{display:flex}
.reveal,.confirm{background:var(--card);border:3px solid var(--accent);border-radius:24px;padding:30px 24px;text-align:center;max-width:560px;width:100%;animation:pop .35s}.reveal .c{opacity:.7;margin-bottom:8px}.reveal .big{font-size:clamp(2rem,9vw,3.6rem);font-weight:800;word-break:break-word;line-height:1.1}.reveal .suspense{font-size:1.1rem;font-weight:700;letter-spacing:.08em;opacity:.8;margin-bottom:12px}.reveal.revealing .big{filter:blur(22px);opacity:.9;transform:scale(.98);letter-spacing:.12em;user-select:none;-webkit-user-select:none}
.confirm h2{margin:0 0 8px}.confirm p{margin:0;opacity:.8}.confirm .actions{display:flex;gap:10px;margin-top:18px}.confirm .actions button{flex:1;margin:0}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#ffb400;padding:10px 18px;border-radius:20px;display:none;z-index:10;max-width:90%;text-align:center}
body.xrma{--bg:#1b1b1b;--fg:#fff;--card:#232323;--line:#3a3a3a;--accent:#ff8a1f;--btn:#ff7a00;--btnfg:#111;background:linear-gradient(135deg,#050505 0%,#141414 60%,#241608 100%);background-attachment:fixed}body.xrma h1{color:#ff7a00}body.xrma .card,body.xrma .mode,body.xrma .side{border:2px solid #ff7a00;box-shadow:0 8px 24px rgba(0,0,0,.6)}body.xrma .grid{background:#262626;border:2px solid #ff7a00}body.xrma .back,body.xrma .ghost{background:#ff7a00;color:#111}body.xrma .err,body.xrma .warning{color:#ff9d6b}body.xrma input,body.xrma textarea{background:#303030;color:#fff;border-color:#555}
#s1{padding-top:14vh}#s1.on,#s2.on,#s3.on{display:flex;flex-direction:column;justify-content:center;padding:32px 18px}#s1 h1,#s2 h1,#s3 h1{font-size:clamp(2rem,7vw,3.2rem)}.card,.modes{width:100%}
#fs{display:inline-block}.presentation #s4 .side{display:none}.presentation #s4 .play{grid-template-columns:1fr}.presentation #s4 .grid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}
@media(min-width:900px){.screen{max-width:1300px;padding-top:80px}#s2,#s3,#s1{max-width:900px}h1{font-size:2.4rem}.card,.modes{max-width:680px}.play{display:grid;grid-template-columns:1fr 300px;gap:24px;align-items:start}.grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:16px;padding:26px;margin:0}.side{position:sticky;top:20px;max-height:82vh;overflow:auto}.side ol{grid-template-columns:1fr}.case:hover{transform:translateY(-4px)}.reveal{max-width:780px}.reveal .big{font-size:4.8rem}#s4.on{display:flex;flex-direction:column;height:100vh;min-height:0;padding:12px 22px 16px;max-width:none}#s4 .bar{padding-left:56px;min-height:44px;flex:none}#s4 .bar h1{font-size:1.6rem}.play{flex:1;min-height:0;grid-template-columns:1fr 300px;grid-template-rows:100%;margin-top:10px}.grid{height:100%;box-sizing:border-box;padding:16px;align-content:center;justify-content:center}.side{height:100%;max-height:none;position:static}}
@media(max-width:520px){.bar{align-items:flex-start}.bar>span{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.bar .ghost{padding:8px 10px}.grid{grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px;padding:12px}.reveal,.confirm{padding:24px 18px}.confirm .actions{flex-direction:column}}
/* Presentation layout fix: prevent the results sidebar from leaving a clipped column */
body.presentation{overflow-x:hidden}
body.presentation #s4 .play{display:block!important;width:100%;min-width:0;max-width:100%;height:100%;overflow:hidden}
body.presentation #s4 .side{display:none!important;width:0!important;min-width:0!important;max-width:0!important;padding:0!important;margin:0!important;overflow:hidden!important}
body.presentation #s4 .grid{width:100%!important;max-width:100%!important;min-width:0!important;margin:0!important;overflow:hidden}
@media(min-width:900px){body.presentation #s4.on{width:100vw;max-width:none;overflow:hidden}body.presentation #s4 .play{flex:1;min-height:0;height:auto}body.presentation #s4 .grid{height:100%;}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<button class="back" id="back" aria-label="Back">←</button>
<section class="screen on" id="s1"><h1>Trainer Login</h1><div class="card"><input id="xid" type="password" placeholder="Enter XID" autocomplete="new-password" autocapitalize="off" spellcheck="false"><div class="err" id="lerr"></div><button class="main" id="login">Log in</button></div></section>
<section class="screen" id="s2"><h1>Choose a mode</h1><p class="sub">How do you want to pick the order?</p><div class="modes"><button class="mode" data-m="names"><b>👤 Names</b>Each case hides a player's name. The class picks a number and the name appears.</button><button class="mode" data-m="numbers"><b>🔢 Numbers</b>Each case hides a place in line, like “You're first!!”</button></div></section>
<section class="screen" id="s3"><h1 id="h3"></h1><p class="sub" id="sub3"></p><div class="card"><div id="namesBox"><textarea id="names" placeholder="One name per line"></textarea><div class="countline"><span id="cnt">0 / 100 names</span><span class="hint" id="dupes"></span></div><div class="tools"><button class="ghost" id="shuffleNames">🔀 Shuffle names</button><button class="ghost" id="removeDupes">Remove duplicates</button><button class="ghost" id="clearNames">Clear list</button></div></div><div id="numBox"><input id="num" type="number" min="1" max="100" inputmode="numeric" placeholder="How many cases? (1–100)"></div><div class="err" id="serr"></div><button class="main" id="start">Start game</button></div></section>
<section class="screen" id="s4"><div class="bar"><h1 style="margin:0">Pick a case!</h1><span><small id="left"></small> <button class="ghost" id="undo">↩ Undo</button> <button class="ghost" id="present">🎬 Presentation</button> <button class="ghost" id="sound">🔇 Sound off</button> <button class="ghost" id="fs">⛶ Full screen</button> <button class="ghost danger" id="reset">Reset</button></span></div><div class="play"><div class="grid" id="grid"></div><div class="side"><h3 style="margin:0">Order so far</h3><ol id="order"></ol></div></div></section>
<div id="ov"><div class="reveal" id="reveal"><div class="suspense" id="suspense">CASE OPENING...</div><div class="c" id="rc"></div><div class="big" id="rt"></div><button class="main" id="ok">Continue</button></div></div>
<div id="resetOv"><div class="confirm"><h2>Reset game?</h2><p>This will reshuffle all cases and clear the current results.</p><div class="actions"><button class="ghost" id="cancelReset">Cancel</button><button class="main" id="confirmReset">Reset game</button></div></div></div>
<div id="toast"></div>
<script>
const $=id=>document.getElementById(id);const OK=['XRMA46','XJAN18'];let mode=null,game=null,cur=1,soundOn=false,presentation=false,opening=false;
function ord(n){const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])}
function cryptoRandom(max){if(max<=1)return 0;const range=0x100000000,limit=Math.floor(range/max)*max;const a=new Uint32Array(1);do{crypto.getRandomValues(a)}while(a[0]>=limit);return a[0]%max}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=cryptoRandom(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function caseSvg(n){const fs=n>=100?22:n>=10?26:30;return `<svg viewBox="0 0 100 96" aria-hidden="true"><defs><linearGradient id="jg${n}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb400"/><stop offset="1" stop-color="#ff5a00"/></linearGradient></defs><path d="M34 24V13a6 6 0 0 1 6-6h20a6 6 0 0 1 6 6v11" fill="none" stroke="#f2f2f2" stroke-width="6" stroke-linecap="round"/><rect x="3" y="22" width="94" height="64" rx="12" fill="url(#jg${n})" stroke="#1a1a1a" stroke-width="3"/><rect x="20" y="22" width="5" height="64" fill="rgba(0,0,0,.16)"/><rect x="75" y="22" width="5" height="64" fill="rgba(0,0,0,.16)"/><rect x="14" y="84" width="14" height="8" rx="3" fill="#9a9a9a"/><rect x="72" y="84" width="14" height="8" rx="3" fill="#9a9a9a"/><rect x="42" y="26" width="16" height="5" rx="2" fill="#fff"/><text x="50" y="64" text-anchor="middle" font-size="${fs}" font-weight="800" font-family="system-ui,sans-serif" fill="#1a1a1a">${n}</text></svg>`}
function show(n){cur=n;document.querySelectorAll('.screen').forEach((s,i)=>s.classList.toggle('on',i+1===n));$('back').style.display=n>1?'block':'none';scrollTo(0,0)}
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2600)}
function playTone(freq=660,duration=.12,type='sine'){if(!soundOn)return;try{const ctx=new(window.AudioContext||window.webkitAudioContext)(),o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.001,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.12,ctx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+duration);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+duration);o.onended=()=>ctx.close()}catch(e){}}
function getNames(){return $('names').value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean)}
function duplicates(arr){const seen=new Set(),dups=new Set();arr.forEach(x=>{const key=x.toLocaleLowerCase();if(seen.has(key))dups.add(x);seen.add(key)});return [...dups]}
function updateNameCount(){const arr=getNames(),dups=duplicates(arr);$('cnt').textContent=`${arr.length} / 100 names`; $('dupes').textContent=dups.length?`${dups.length} duplicate name(s) detected`:'';$('dupes').className=dups.length?'warning':'hint'}
function build(contents){return {mode,cases:shuffle(contents).map((c,i)=>({n:i+1,c,gone:false})),order:[],initial:contents.slice()}}
$('login').onclick=()=>{const v=$('xid').value.trim().toUpperCase();if(OK.includes(v)){document.body.classList.toggle('xrma',v==='XRMA46');$('lerr').textContent='';$('xid').value='';show(2)}else $('lerr').textContent='Incorrect XID. Try again.'};$('xid').onkeydown=e=>{if(e.key==='Enter')$('login').click()};$('back').onclick=()=>show(Math.max(1,cur-1));
document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{mode=b.dataset.m;$('namesBox').style.display=mode==='names'?'block':'none';$('numBox').style.display=mode==='numbers'?'block':'none';$('h3').textContent=mode==='names'?'Enter student names':'How many cases?';$('sub3').textContent=mode==='names'?'One name per line. Up to 100 players.':'One case for each player. Up to 100.';$('serr').textContent='';updateNameCount();show(3)});
$('names').oninput=updateNameCount;$('shuffleNames').onclick=()=>{const a=getNames();$('names').value=shuffle(a).join('\n');updateNameCount();toast('Names shuffled in the list')};$('removeDupes').onclick=()=>{const a=getNames(),seen=new Set(),clean=a.filter(n=>{const k=n.toLocaleLowerCase();if(seen.has(k))return false;seen.add(k);return true});$('names').value=clean.join('\n');updateNameCount();toast(`Removed ${a.length-clean.length} duplicate(s)`)};$('clearNames').onclick=()=>{if(getNames().length&&!confirm('Clear all names from the list?'))return;$('names').value='';updateNameCount()};$('num').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('start').click()}};
$('start').onclick=()=>{let contents;if(mode==='names'){contents=getNames();if(!contents.length){$('serr').textContent='Add at least one name.';return}if(contents.length>100){$('serr').textContent=`Maximum is 100 names (you have ${contents.length}).`;return}const d=duplicates(contents);if(d.length){$('serr').textContent='Duplicate names detected. Remove duplicates or edit the list first.';return}}else{const n=parseInt($('num').value,10);if(!n||n<1||n>100){$('serr').textContent='Enter a number from 1 to 100.';return}contents=Array.from({length:n},(_,i)=>`You're ${ord(i+1)}!!`)}$('serr').textContent='';game=build(contents);show(4);render();toast('Cases shuffled. Good luck!')};
function render(){const g=$('grid');g.innerHTML='';game.cases.forEach(k=>{if(k.gone){const p=document.createElement('div');p.className='ph';g.appendChild(p);return}const b=document.createElement('button');b.className='case';b.innerHTML=caseSvg(k.n);b.setAttribute('aria-label',`Case ${k.n}`);b.onclick=()=>open(k,b);g.appendChild(b)});$('left').textContent=game.cases.filter(k=>!k.gone).length+' left';$('undo').disabled=game.order.length===0;$('undo').style.opacity=game.order.length?'1':'.45';const o=$('order');o.innerHTML='';game.order.forEach((r,i)=>{const li=document.createElement('li');li.innerHTML='<span class="n"></span><span></span>';li.children[0].textContent=(i+1)+'.';li.children[1].textContent=game.mode==='names'?`${r.c} (case ${r.n})`:`Case ${r.n} → ${r.c.replace(/^You're /,'').replace('!!','')}`;o.appendChild(li)});fit()}
function open(k,b){if(k.gone||opening)return;opening=true;k.gone=true;game.order.push(k);b.classList.add('shaking');playTone(220,.16,'triangle');$('rc').textContent=`Case #${k.n}`;$('rt').textContent=k.c;$('suspense').textContent='CASE OPENING...';$('reveal').classList.add('revealing');$('ov').classList.add('on');$('ok').disabled=true;setTimeout(()=>{$('suspense').textContent='THE RESULT IS...';playTone(440,.12);setTimeout(()=>{$('rt').textContent=k.c;$('reveal').classList.remove('revealing');$('suspense').textContent='REVEALED!';playTone(880,.22,'triangle');$('ok').disabled=false},500)},850)}
$('ok').onclick=()=>{$('ov').classList.remove('on');opening=false;render()};$('undo').onclick=()=>{if(!game||!game.order.length||opening)return;const last=game.order.pop();const k=game.cases.find(c=>c.n===last.n);if(k)k.gone=false;render();toast(`Undid Case #${last.n}`)};
$('present').onclick=()=>{presentation=!presentation;document.body.classList.toggle('presentation',presentation);$('present').textContent=presentation?'🧾 Normal view':'🎬 Presentation';requestAnimationFrame(()=>requestAnimationFrame(fit))};$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'🔊 Sound on':'🔇 Sound off';if(soundOn)playTone(660,.1)};
function fit(){const g=$('grid');if(!game||!matchMedia('(min-width:900px)').matches){g.style.display='';g.style.flexDirection='';g.style.alignItems='';g.style.justifyContent='';g.style.gap='';return}const cells=[...g.querySelectorAll('.case,.ph')],gap=16,cs=getComputedStyle(g),W=g.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),H=g.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom),n=cells.length;if(!W||!H||!n)return;let best={w:0,r:1,c:1};for(let r=1;r<=n;r++){let c=Math.ceil(n/r),w=Math.min(220,(W-gap*(c-1))/c,((H-gap*(r-1))/r)*(100/96));if(w>best.w)best={w,r,c}}g.innerHTML='';g.style.display='flex';g.style.flexDirection='column';g.style.alignItems='center';g.style.justifyContent='center';g.style.gap=gap+'px';let idx=0;for(let row=0;row<best.r;row++){let count=Math.ceil((n-idx)/(best.r-row)),line=document.createElement('div');line.style.cssText=`display:flex;justify-content:center;gap:${gap}px`;for(let j=0;j<count;j++){let c=cells[idx++];c.style.width=Math.floor(best.w)+'px';line.appendChild(c)}g.appendChild(line)}}
addEventListener('resize',()=>fit());const isFull=()=>!!document.fullscreenElement||(innerHeight>=screen.height-2&&innerWidth>=screen.width-2);function fsLabel(){$('fs').textContent=isFull()?'↙ Minimize':'⛶ Full screen'}$('fs').onclick=()=>{try{if(document.fullscreenElement)document.exitFullscreen();else if(isFull())toast('Use your browser/device controls to exit full screen.');else document.documentElement.requestFullscreen().catch(()=>toast('Full screen is unavailable on this device.'))}catch(e){toast('Full screen is unavailable on this device.')}};document.addEventListener('fullscreenchange',()=>{fsLabel();setTimeout(fit,100)});addEventListener('resize',fsLabel);
$('reset').onclick=()=>{$('resetOv').classList.add('on')};$('cancelReset').onclick=()=> $('resetOv').classList.remove('on');$('confirmReset').onclick=()=>{if(!game)return;game=build(game.initial);$('resetOv').classList.remove('on');render();toast('Game reset and reshuffled')};
</script>
</body>
</html>
